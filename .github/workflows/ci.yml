name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, codex/formal-successor]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  formal-successor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check successor authority and predecessor freeze
        run: node tools/successor_control_check.js

      - name: Build and independently check the formal successor
        uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: "1"
        with:
          lake-package-directory: formal
          build: true
          build-args: --wfail
          test: false
          leanchecker: true
          leanchecker-args: InquiryCalculus Spec
          axiom-audit: true
          # axiom-audit root is a declaration namespace, not a Lake module root.
          axiom-audit-root: InquiryCalculus

      - name: Recheck the Phase B spine against the installed Lean toolchain
        run: |
          node tools/phase_b_predecessor_spine_check.js --compile
          node tools/phase_b_binding_type_check.js --compile
          node tools/phase_b_forms_check.js --compile
          node tools/phase_b_relations_check.js --compile
          node tools/phase_b_refinement_check.js --compile
          node tools/phase_b_formula_grammar_check.js --compile
          node tools/phase_b_minimal_logical_basis_check.js --compile
          node tools/phase_b_relation_expression_ir_check.js --compile
          node tools/phase_b_relation_schema_ports_check.js --compile
          node tools/phase_b_partial_binding_fiber_check.js --compile
          node tools/phase_b_canonical_question_syntax_check.js --compile
          node tools/phase_b_answer_carrier_validity_check.js --compile
          node tools/phase_b_proposition_not_warrant_check.js --compile

  phase-0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo test --locked --workspace --all-features

  specification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check documentation control topology
        shell: bash
        run: |
          set -euo pipefail
          base=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
          fi
          DOCS_CONTROL_BASE="$base" python3 tools/docs_control_check.py

      - name: Check delivered diff whitespace
        shell: bash
        run: |
          set -euo pipefail
          base=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
          fi
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]] && git cat-file -e "$base^{commit}"; then
            git diff --check "$base" HEAD --
          else
            git show --check --format= HEAD
          fi

      - name: Check inquiry harness
        shell: bash
        run: |
          set -euo pipefail
          node --check .claude/hooks/ic-run.js
          node --check .claude/hooks/ic-append.js
          node --check .claude/hooks/ic-question-program.js
          node --check .claude/hooks/ic-residual-topology.js
          node --check .claude/hooks/ic-construction-policy.js
          node --check tools/harness_control_check.js
          node --check tools/harness_acceptance_check.js
          node --check tools/exploration_algorithm_check.js
          node --check tools/predecessor_inventory.js
          node --check tools/predecessor_inventory_check.js
          node --check tools/predecessor_tex_classification.js
          node --check tools/predecessor_tex_classification_check.js
          node --check tools/predecessor_implementation_classification.js
          node --check tools/predecessor_implementation_classification_check.js
          node --check tools/predecessor_fixture_classification.js
          node --check tools/predecessor_fixture_classification_check.js
          node --check tools/phase_a_coverage.js
          node --check tools/phase_a_coverage_check.js
          node --check tools/phase_b_predecessor_spine.js
          node --check tools/phase_b_predecessor_spine_check.js
          node --check tools/phase_b_binding_type.js
          node --check tools/phase_b_binding_type_check.js
          node --check tools/phase_b_forms.js
          node --check tools/phase_b_forms_check.js
          node --check tools/phase_b_relations.js
          node --check tools/phase_b_relations_check.js
          node --check tools/phase_b_refinement.js
          node --check tools/phase_b_refinement_check.js
          node --check tools/phase_b_formula_grammar.js
          node --check tools/phase_b_formula_grammar_check.js
          node --check tools/phase_b_minimal_logical_basis.js
          node --check tools/phase_b_minimal_logical_basis_check.js
          node --check tools/phase_b_relation_expression_ir.js
          node --check tools/phase_b_relation_expression_ir_check.js
          node --check tools/phase_b_relation_schema_ports.js
          node --check tools/phase_b_relation_schema_ports_check.js
          node --check tools/phase_b_partial_binding_fiber.js
          node --check tools/phase_b_partial_binding_fiber_check.js
          node --check tools/phase_b_canonical_question_syntax.js
          node --check tools/phase_b_canonical_question_syntax_check.js
          node --check tools/phase_b_answer_carrier_validity.js
          node --check tools/phase_b_answer_carrier_validity_check.js
          node --check tools/phase_b_proposition_not_warrant.js
          node --check tools/phase_b_proposition_not_warrant_check.js
          bash -n .claude/hooks/ic-trace
          bash -n .claude/hooks/ic-guard
          bash -n .claude/hooks/ic-inject
          bash -n .claude/hooks/ic-stop
          node tools/harness_control_check.js
          node tools/harness_acceptance_check.js
          node tools/exploration_algorithm_check.js
          node tools/predecessor_inventory.js check
          node tools/predecessor_inventory_check.js
          node tools/predecessor_tex_classification.js check
          node tools/predecessor_tex_classification_check.js
          node tools/predecessor_implementation_classification.js check
          node tools/predecessor_implementation_classification_check.js
          node tools/predecessor_fixture_classification.js check
          node tools/predecessor_fixture_classification_check.js
          node tools/phase_a_coverage.js check
          node tools/phase_a_coverage_check.js
          node tools/phase_b_predecessor_spine.js check
          node tools/phase_b_predecessor_spine_check.js
          node tools/phase_b_binding_type.js check
          node tools/phase_b_binding_type_check.js
          node tools/phase_b_forms.js check
          node tools/phase_b_forms_check.js
          node tools/phase_b_relations.js check
          node tools/phase_b_relations_check.js
          node tools/phase_b_refinement.js check
          node tools/phase_b_refinement_check.js
          node tools/phase_b_formula_grammar.js check
          node tools/phase_b_formula_grammar_check.js
          node tools/phase_b_minimal_logical_basis.js check
          node tools/phase_b_minimal_logical_basis_check.js
          node tools/phase_b_relation_expression_ir.js check
          node tools/phase_b_relation_expression_ir_check.js
          node tools/phase_b_relation_schema_ports.js check
          node tools/phase_b_relation_schema_ports_check.js
          node tools/phase_b_partial_binding_fiber.js check
          node tools/phase_b_partial_binding_fiber_check.js
          node tools/phase_b_canonical_question_syntax.js check
          node tools/phase_b_canonical_question_syntax_check.js
          node tools/phase_b_answer_carrier_validity.js check
          node tools/phase_b_answer_carrier_validity_check.js
          node tools/phase_b_proposition_not_warrant.js check
          node tools/phase_b_proposition_not_warrant_check.js

      - name: Install pinned official Tectonic
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz"
          binary_dir="$RUNNER_TEMP/tectonic-0.17.0"
          url="https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz"
          sha256="1a715688baf591e650c8aeb160ae934e181685eecbb38b317de30b269ac5d606"

          curl --fail --location --silent --show-error \
            --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            "$url" --output "$archive"
          echo "$sha256  $archive" | sha256sum --check -
          mkdir -p "$binary_dir"
          tar --extract --gzip --file "$archive" --directory "$binary_dir"
          "$binary_dir/tectonic" --version
          echo "$binary_dir" >> "$GITHUB_PATH"

      - name: Compile canonical specification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/tex
          tectonic -X compile \
            --keep-logs \
            --outdir target/tex \
            Inquiry_Calculus_v2_0.tex \
            2>&1 | tee target/tex/tectonic-driver.log

          reference_errors='undefined references?|reference .* undefined|multiply[- ]defined labels?|label .* multiply defined|duplicate labels?|destination with the same identifier'
          if grep --extended-regexp --ignore-case --line-number "$reference_errors" target/tex/*.log; then
            echo "Canonical specification contains unresolved or duplicate references." >&2
            exit 1
          fi
