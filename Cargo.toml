[workspace]
members = [
    "crates/ic-cli",
    "crates/ic-core",
    "crates/ic-runtime",
    "crates/ic-store",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace.dependencies]
hex = "0.4.3"
proptest = "1.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
ureq = "3.4.0"

[workspace.lints.rust]
unsafe_code = "forbid"
